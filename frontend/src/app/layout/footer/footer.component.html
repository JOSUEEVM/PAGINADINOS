<footer class="footer">
  <div class="footer-content">

    <div class="footer-section brand">
      <img src="assets/texto.png" alt="Dino's Pizzas" class="logo" />
      <p>¡Las mejores pizzas de la ciudad!<br>Ingredientes frescos y mucho queso 🧀</p>
    </div>

    <div class="footer-section links">
      <h4>Enlaces Rápidos</h4>

      <button
        class="link-item"
        [routerLink]="['/menu']"
        fragment="promociones"
      >
        Promociones
      </button>

      <button
        class="link-item"
        [routerLink]="['/menu']"
        fragment="pizzas"
      >
        Pizzas
      </button>
      
      <button class="link-item" (click)="openMaps()">Ubicación</button>
      <button class="link-item" (click)="openWhatsApp()">Contacto por WhatsApp</button>

      <button class="link-item" routerLink="/privacy">Aviso de Privacidad</button>
      <button class="link-item" routerLink="/conditions">Términos y Condiciones</button>
    </div>

    <div class="footer-section contact">
      <h4>Contáctanos</h4>
      <p>C. 27 63, San Pedro, 24920 Dzitbalché, Camp.</p>
      <p>996 730 70 86</p>
      <p>996 112 01 92</p>
      <p>Lun – Dom: 06:00 pm – 11:00 pm</p>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 Dino's Pizzas — Todos los derechos reservados
  </div>
</footer>
