<div
  class="modal"
  (click)="closeModal()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div
    class="modal-card"
    (click)="$event.stopPropagation()"
    [@slideAnimation]="{
      value: animationKey,
      params: {
        enterFrom: direction === 'left'
          ? 'translateX(100%)'
          : 'translateX(-100%)'
      }
    }"
  >
    <button class="close-btn" (click)="closeModal()" type="button">✕</button>
    <button class="nav left" (click)="anterior()">❮</button>

    <div class="content-section">
      <h2 class="pizza-title">{{ pizzaActual.nombre }}</h2>

      <div class="image-section">
        <img [src]="pizzaActual.imagen" [alt]="pizzaActual.nombre" />
      </div>

      <div class="actions">
        <a
          class="btn primary"
          href="https://wa.me/529961070587"
          target="_blank"
          rel="noopener"
        >
          Pedir por WhatsApp
        </a>

        <a
          class="btn ghost"
          href="https://m.me/dinos.pizzas.7"
          target="_blank"
          rel="noopener"
        >
          Pedir por Facebook
        </a>
      </div>

      <div class="sizes">
        <button *ngFor="let t of pizzaActual.tamanos">
          {{ t.nombre }} <span>${{ t.precio }}</span>
        </button>
      </div>
    </div>

    <button class="nav right" (click)="siguiente()">❯</button>
  </div>
</div>
